packages:
  - '.'
  - 'packages/*'
  - 'apps/*'

overrides:
  vite: 6.3.5
  lightningcss: 1.30.1

# @react-native-community/slider declares no peers, so without this its `require('react')`
# would resolve the root web app's React 18 instead of the react-native package's React 19,
# producing two React copies and "Invalid hook call".
packageExtensions:
  '@react-native-community/slider':
    peerDependencies:
      react: '*'
      react-native: '*'
